{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gecko-nodepool.fullname" . }}
  labels:
    {{- include "gecko-nodepool.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["nodepools"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["nodepools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gcp.managed.openshift.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gecko-nodepool.fullname" . }}
  labels:
    {{- include "gecko-nodepool.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gecko-nodepool.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-nodepool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.garAccess.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gecko-nodepool.fullname" . }}-gar-reader
  namespace: {{ default .Release.Namespace .Values.garAccess.iamNamespace }}
rules:
  - apiGroups: ["iam.cnrm.cloud.google.com"]
    resources: ["iampolicymembers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gecko-nodepool.fullname" . }}-gar-reader
  namespace: {{ default .Release.Namespace .Values.garAccess.iamNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gecko-nodepool.fullname" . }}-gar-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "gecko-nodepool.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
