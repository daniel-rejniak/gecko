{{- include "gecko-nodepool.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gecko-nodepool.fullname" . }}
  labels:
    {{- include "gecko-nodepool.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "gecko-nodepool.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.garPullSecret.enabled }}
      annotations:
        {{- if .Values.garPullSecret.enabled }}
        checksum/gar-config: {{ include (print $.Template.BasePath "/gar-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "gecko-nodepool.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gecko-nodepool.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.garPullSecret.enabled }}
      volumes:
        - name: gar-config
          configMap:
            name: {{ include "gecko-nodepool.fullname" . }}-gar-config
      {{- end }}
      containers:
        - name: nodepool
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - nodepool
            {{- if .Values.orlopURL }}
            - --orlop-url={{ .Values.orlopURL }}
            {{- end }}
            - --log-level={{ .Values.logLevel }}
            - --log-format={{ .Values.logFormat }}
            - --workers={{ .Values.workers }}
            {{- if .Values.garPullSecret.enabled }}
            - --gar-config-file=/etc/config/gar/gar.json
            {{- end }}
          {{- if .Values.garPullSecret.enabled }}
          volumeMounts:
            - name: gar-config
              mountPath: /etc/config/gar
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
