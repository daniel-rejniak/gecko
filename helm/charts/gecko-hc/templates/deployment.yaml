{{- include "gecko-hc.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gecko-hc.fullname" . }}
  labels:
    {{- include "gecko-hc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "gecko-hc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $hasAnnotations := or .Values.podAnnotations (and .Values.customerLabels (ne .Values.customerLabels "{}")) .Values.garPullSecret.enabled }}
      {{- if $hasAnnotations }}
      annotations:
        {{- if and .Values.customerLabels (ne .Values.customerLabels "{}") }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.garPullSecret.enabled }}
        checksum/gar-config: {{ include (print $.Template.BasePath "/gar-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "gecko-hc.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gecko-hc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or (and .Values.customerLabels (ne .Values.customerLabels "{}")) .Values.garPullSecret.enabled }}
      volumes:
        {{- if and .Values.customerLabels (ne .Values.customerLabels "{}") }}
        - name: customer-labels
          configMap:
            name: {{ include "gecko-hc.fullname" . }}-customer-labels
        {{- end }}
        {{- if .Values.garPullSecret.enabled }}
        - name: gar-config
          configMap:
            name: {{ include "gecko-hc.fullname" . }}-gar-config
        {{- end }}
      {{- end }}
      containers:
        - name: hc
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - hc
            {{- if .Values.orlopURL }}
            - --orlop-url={{ .Values.orlopURL }}
            {{- end }}
            - --log-level={{ .Values.logLevel }}
            - --log-format={{ .Values.logFormat }}
            - --workers={{ .Values.workers }}
            - --pull-secret-store-name={{ .Values.pullSecret.storeName }}
            - --pull-secret-gcp-key={{ .Values.pullSecret.gcpKey }}
            {{- if .Values.garPullSecret.enabled }}
            - --gar-config-file=/etc/config/gar/gar.json
            {{- end }}
          {{- if and .Values.customerLabels (ne .Values.customerLabels "{}") }}
            - --customer-labels-file=/etc/config/customer-labels/customer-labels.json
          {{- end }}
          {{- if or (and .Values.customerLabels (ne .Values.customerLabels "{}")) .Values.garPullSecret.enabled }}
          volumeMounts:
            {{- if and .Values.customerLabels (ne .Values.customerLabels "{}") }}
            - name: customer-labels
              mountPath: /etc/config/customer-labels
              readOnly: true
            {{- end }}
            {{- if .Values.garPullSecret.enabled }}
            - name: gar-config
              mountPath: /etc/config/gar
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
